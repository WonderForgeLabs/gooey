name: Vendor autofix

# The privileged half of vendor-freshness.yml: regenerate vendor/ and push it
# back, so a bump that only ever needed `go work vendor` goes green on its own
# instead of waiting for a human to notice a protobuf step complaining about
# grpc.
#
# ── WHY THIS IS pull_request_target, AND WHAT MAKES THAT SAFE HERE ──────────
#
# Dependabot branches live in this repo, but GitHub withholds repository
# secrets from `pull_request` runs triggered by Dependabot and hands them a
# READ-ONLY token (anti-exfiltration: a compromised dependency bump must not
# be able to read secrets). The same rule is why claude-code-review.yml skips
# the review for dependabot. So a plain `pull_request` workflow physically
# cannot push the fix, and pull_request_target — which runs in the BASE repo's
# context with a writable token — is the only trigger that can.
#
# pull_request_target is also the classic way to hand a privileged token to
# somebody else's code, so every mitigation below is load-bearing:
#
#   * gooey is PUBLIC. The job refuses anything that is not dependabot AND not
#     a same-repo branch, so a fork PR can never reach it.
#   * It runs exactly one command against the checkout, `go work vendor`,
#     under GOTOOLCHAIN=local. That resolves modules and copies files; it does
#     not build, test, or run `go generate`.
#
#     GOTOOLCHAIN=local is what makes "no PR code executes" TRUE rather than
#     nearly true. Without it a `toolchain go1.xx.y` line in any go.mod in the
#     PR would have `go` download that toolchain and re-exec itself under it —
#     PR-controlled code running under a writable token, through a door with
#     nothing to do with vendoring. Raised in review of #452, where the claim
#     above was stated as absolute and was not.
#   * The checkout is pinned to the head SHA, never a ref name.
#   * permissions is contents: write and nothing else.
#
# The unprivileged check in vendor-freshness.yml is what actually GUARDS the
# invariant — it runs on every PR including forks, and it is the one that must
# stay green. This workflow is a convenience that removes a round trip; if it
# is ever in doubt, delete it and the guard still holds.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - 'go.work'
      - 'go.work.sum'

permissions:
  contents: write

concurrency:
  group: vendor-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  autofix:
    # Both halves matter. The first keeps this off human PRs, whose authors
    # can run `go work vendor` themselves and should see the guard instead.
    # The second keeps it off forks, where the branch is not ours to push to
    # and the token must never be exposed to the diff.
    #
    # `github.actor` is who triggered THIS event, which for a
    # dependabot-opened or dependabot-updated PR is dependabot — but that is
    # not the same question as "who authored the PR". A human pushing to a
    # dependabot branch is actor=that-human and skips this job. That is the
    # safe direction to be imprecise in, and it is why the head-repo check is
    # separate rather than implied by it. Noted in review of #452.
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # default, not small, for the reason given in vendor-freshness.yml:
    # this runs the Go toolchain, not a shell one-liner.
    runs-on: forge-runners-default-vsphere
    steps:
      # SHA, not ref: github.event.pull_request.head.ref is attacker-shaped
      # input in the general case, and a SHA is a hex string that cannot be
      # anything else. The push below still needs the branch NAME, which is
      # why it goes through an env var there rather than being interpolated
      # into a script — the two halves of the same precaution.
      #
      # lfs: true because TestEveryCheckoutFetchesLFS requires it of every
      # workflow checkout in this repo; without it the job silently gets
      # pointer text in place of every *.wav/*.gif/*.png.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: true

      # NEEDS EGRESS, which is worth knowing because the rest of this repo's
      # Go story is built on not needing it. vendor/ makes BUILDS network-free;
      # it does not make REBUILDING vendor/ network-free. Verified against
      # #451's branch, where it printed "downloading google.golang.org/grpc
      # v1.83.1" before it could write anything — and that was a WARM cache
      # with only the bumped module missing. On a cold runner it fetches the
      # whole module graph, not one dependency. On a runner that cannot reach
      # the proxy this fails rather than silently vendoring the old version,
      # which is the right failure and the same class of outage as #448.
      - name: Regenerate the vendor directory
        env:
          GOTOOLCHAIN: local
        run: go work vendor

      - name: Push the result if it changed
        env:
          # Quoted into the environment rather than interpolated into the
          # script, per the workflow-injection guidance. HEAD_REF is only ever
          # passed to git as a ref name.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Stage FIRST, then ask whether anything is staged. The earlier
          # version asked `git diff --quiet` over the whole tree and then
          # staged only `vendor`, which disagrees in both directions: it
          # missed newly ADDED vendor directories (git diff ignores untracked
          # files), and it proceeded to an empty commit — failing with
          # "nothing added to commit" — when `go work vendor` had touched
          # go.sum or go.work.sum without changing vendor/ at all. Raised in
          # review of #452.
          #
          # -A over the whole tree rather than a path list, because
          # `go work vendor` legitimately updates go.sum and go.work.sum
          # alongside vendor/, and those belong in the same commit.
          git add -A
          if git diff --cached --quiet; then
            echo "vendor/ already matched the modules; nothing to push."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(deps): go work vendor

          Regenerated by .github/workflows/vendor-autofix.yml. The bump changed
          a require, and this repo keeps ONE root vendor/ for every module in
          go.work, so the directory has to be rebuilt alongside it or `go`
          refuses with "inconsistent vendoring" on the next command it runs.'
          git push origin "HEAD:$HEAD_REF"

          # A push made with the default GITHUB_TOKEN does NOT trigger
          # workflows — GitHub's recursion guard. So the required checks stay
          # sitting on the OLD head and the PR does not go green on its own,
          # which is most of what this workflow was for.
          #
          # Called out rather than silently worked around, because the fix is
          # a policy decision and not a line of YAML: it needs an identity
          # whose pushes DO trigger CI — the WF_RUNNERS_APP token
          # claude-code-review.yml already uses, or a PAT. Wiring a writable
          # App token into a pull_request_target job is exactly the escalation
          # this file's header is careful about, so it wants a deliberate yes
          # rather than my assumption. Until then a maintainer re-runs CI once
          # per bump, which still beats diagnosing the vendoring by hand.
          # Raised in review of #452.
          echo "::notice::Pushed the regenerated vendor/. CI will NOT re-run by itself (pushes made with GITHUB_TOKEN do not trigger workflows) — re-run CI on the new head to clear the gate. See the comment in this workflow for why that is not automated yet."
