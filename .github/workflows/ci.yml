name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/wonderforgelabs/gooey

jobs:
  # EVERY MODULE IN THE REPO IS DISCOVERED HERE — NOTHING BELOW NAMES ONE.
  #
  # The `test` job used to be seven steps: `go build/vet/test` for the
  # root, then one literal `if [ -f <path>/go.mod ]` step each for
  # handlers/temporal, handlers/exec, imagefmt/svg and mcp (with grpc's
  # copy over in `contract`), plus a glob loop for packs/*. Only the glob
  # was discovery, and the comment on it already predicted what happened
  # next: "a module added without also editing this file is never built,
  # and the guard makes that look like a pass."
  #
  # It came true twice. `paint/` (the fogleman/gg bridge, #229 and #241)
  # landed with no step at all and was caught by a human reading a diff.
  # `apps/wysiwyg` — a real consumer of core — was never built either,
  # alongside apps/gitui, apps/kanban and
  # apps/dynamic-activities. Both times every job was green, because a
  # green CI meant "everything I was told about passed".
  #
  # The discovery below is character-for-character the loop in CLAUDE.md's
  # `## Verify` section — same `find`, same pruning — because
  # `TestCIWorkflowDiscoversEveryNestedModule` extracts this exact command
  # out of this file, runs it, and compares the result against a walk of
  # the tree. That test is what makes the module count KNOWABLE rather
  # than asserted: it goes red the moment this command stops reaching a
  # module, which no amount of green in the matrix can do on its own.
  # `TestCLAUDEMDVerifyLoopReachesEveryNestedModule` pins the doc the same
  # way, so the workflow and the doc cannot drift apart either.
  discover:
    # find + git ls-files + jq, no build toolchain and no Docker — the
    # shape forge-runners-small-vsphere's 2Gi tier exists for.
    runs-on: forge-runners-small-vsphere
    outputs:
      matrix: ${{ steps.mods.outputs.matrix }}
      count: ${{ steps.mods.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Discover modules
        id: mods
        run: |
          set -u

          # `-mindepth 1` lets a depth-1 dot-directory be pruned at all AND
          # keeps `-name` off the starting point; without it `.?*` matches
          # `.` itself, prunes the whole walk, prints nothing, and still
          # exits 0. Pruning at every depth (not `-not -path './.*'`, which
          # only anchors at the top) keeps this out of .claude/worktrees/
          # and stray .venv trees on a developer machine. Neither exists in
          # a clean CI checkout — that asymmetry is exactly why the rule
          # has to be written here rather than rediscovered locally.
          tmp=${RUNNER_TEMP:-/tmp}
          find . -mindepth 1 -name '.?*' -prune -o -name go.mod -print |
            sed 's|^\./||' | sort > "$tmp/modules-found"

          # A SECOND, INDEPENDENT MECHANISM, because an empty matrix is the
          # same bug in a new costume: GitHub SKIPS a job whose matrix has
          # no legs, and a skipped job is not a failed one. git knows the
          # tracked go.mod files; the walk knows the ones on disk. Any
          # disagreement is a real defect — either the prune/pathspec
          # broke, or somebody added a module and never `git add`ed its
          # go.mod, in which case CI would be testing a module that does
          # not exist for anybody else. Two mechanisms agreeing is a
          # stronger claim than "at least one was found", which 0 == 0 also
          # satisfies.
          git ls-files -- ':(glob)**/go.mod' | sort > "$tmp/modules-tracked"
          if ! diff -u "$tmp/modules-tracked" "$tmp/modules-found"; then
            echo "::error::the module walk and git ls-files disagree; see the diff above"
            exit 1
          fi

          mapfile -t mods < "$tmp/modules-found"
          # The floor the cross-check cannot provide on its own. The root
          # go.mod is the one module whose absence means the checkout
          # itself is broken, so requiring it plus one more is a bound that
          # no plausible breakage satisfies by accident. Membership, not
          # position: the list is sorted, and `apps/…` sorts before
          # `go.mod`, so testing mods[0] rejected a perfectly good tree
          # (found by running this script against the worktree).
          if [ "${#mods[@]}" -lt 2 ] || ! grep -qxF 'go.mod' "$tmp/modules-found"; then
            printf '%s\n' "${mods[@]}"
            echo "::error::discovery found ${#mods[@]} module(s) and no root go.mod — the checkout or the walk is broken"
            exit 1
          fi

          # The ONLY hand-written classification left in this file, and it
          # matches PATH PATTERNS, not module names: a new pack, handler or
          # example is covered the moment its go.mod is committed.
          #
          # THE RULE, stated so the arms can be checked against it: a
          # module races when its tests exist to prove that nothing
          # touches the property graph off the UI goroutine — that is,
          # when it serves somebody else's goroutine. handlers/*, packs/*,
          # mcp and grpc all do (RPCs, tool bodies, activity goroutines,
          # child-process callbacks); #182 sat on main because one of them
          # was not raced. paint starts no goroutines at all, so the
          # detector would buy CI time and no assertion — the reasoning
          # #258 wrote for its own step, kept here now that discovery
          # subsumes it.
          #
          # That rule is NOT derivable, and pretending otherwise would be
          # worse than a case statement: "serves a foreign goroutine" is a
          # claim about what a suite asserts, not a property of the tree,
          # and every mechanical proxy (does it spawn goroutines? does it
          # import net/http?) misclassifies the root module, which spawns
          # plenty and is deliberately not raced. What IS derivable is the
          # drift: TestCIWorkflowRaceTierMatchesCLAUDEMD compares this arm
          # against CLAUDE.md's, and rejects a namespaced entry written
          # literally (`handlers/temporal` instead of `handlers/*`),
          # because a literal is where the next module silently drops a
          # tier.
          #
          # The safe evolution, if this ever drifts again, is to invert it:
          # race by DEFAULT and make exemption the explicit act, so a new
          # module fails toward the stronger check. Not done here — it
          # would race the root module, which is a tier change, and tier
          # changes belong in their own PR rather than smuggled into a
          # mechanism one.
          #
          # apps/* are VETTED BUT NOT TESTED. Vetting is the point: it
          # is what catches a core API change breaking a consumer, the
          # breakage CLAUDE.md says goes silent today. Their tests are
          # deliberately left out — apps/wysiwyg alone carries
          # goroutine-leak, pty-harness and control-plane-server suites,
          # and putting that flake surface on a required gate buys little,
          # since an example is not part of the framework's contract.
          # Promoting one is a one-line change to the case below.
          #
          # Everything the two arms above do not name gets the plain run —
          # written as the default arm rather than a third list, so nobody
          # has to keep a roster of library modules current. That the root
          # module's own tests do not race is a known gap, inherited
          # unchanged rather than smuggled into this change.
          for mod in "${mods[@]}"; do
            m=${mod%go.mod}; m=${m%/}; m=${m:-.}
            case "$m" in
              apps/*)                      mode='vet'  ;;
              handlers/*|packs/*|mcp|grpc) mode='race' ;;
              *)                           mode='test' ;;
            esac
            printf '%s\t%s\n' "$m" "$mode"
          done > "$tmp/modules-tiered"

          # ONE LEG PER TIER, not per module. The tiering above is
          # unchanged and still per module — this only decides how the
          # legs are PACKED, and packing is not coverage. `group_by`
          # cannot invent a mode nobody tiered or drop one somebody did,
          # so every discovered module lands in exactly one leg by
          # construction; the check below is what proves that rather than
          # asserting it.
          matrix=$(jq -Rnc '
            [inputs | split("\t") | {module: .[0], mode: .[1]}]
            | group_by(.mode)
            | map({
                mode:    .[0].mode,
                count:   length,
                modules: (map(.module) | join(" "))
              })
            | sort_by(.mode)
          ' < "$tmp/modules-tiered")
          legs=$(jq length <<<"$matrix")

          # The legs must COVER every discovered module or this job is
          # lying about its own coverage — the failure mode being fixed,
          # one level up. Counting legs WAS that check while there was a
          # leg per module; under packing it is not, because `legs` is 3
          # whether the tiers hold every module or one. Sum the per-leg
          # counts instead — that is the quantity that still has to match.
          # `// 0` so an empty matrix reads as 0 and trips this, rather
          # than comparing null against a number and passing.
          covered=$(jq '[.[].count] | add // 0' <<<"$matrix")
          if [ "$covered" != "${#mods[@]}" ]; then
            echo "::error::$legs matrix leg(s) cover $covered of ${#mods[@]} discovered module(s)"
            exit 1
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # MODULES, not legs. The `modules` gate reads this and requires
          # >= 2; while legs == modules the two were interchangeable, and
          # emitting `legs` here would now clear that floor with three
          # legs covering nothing at all.
          echo "count=${#mods[@]}" >> "$GITHUB_OUTPUT"
          {
            echo "### ${#mods[@]} modules discovered across $legs leg(s)"
            echo
            jq -r '.[] | "- **\(.mode)** (\(.count)): \(.modules)"' <<<"$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  # One leg per TIER — vet, test, race — each looping the modules
  # discovery put in that tier. It used to be a leg per module, which read
  # better (`apps/gitui (vet)` red by name) and cost 25 runner slots per
  # push to say it. On the shared, non-elastic vSphere pool this repo now
  # schedules on, that is 25 pods competing with production for a job
  # whose slowest leg is two minutes.
  #
  # What the per-module shape actually bought was FAILURE ATTRIBUTION, and
  # that is kept rather than traded: the loop below records every failing
  # module to a file and fails the leg with all of them named, so a core
  # API change still reports the full list of consumers it broke — which
  # is more than `fail-fast: false` gave, since that stopped each leg at
  # its first red step. What is genuinely lost is the module name in the
  # CHECK name; it moves into the annotation, the ::group:: and the step
  # summary. No branch ruleset requires these checks by name today, which
  # is what makes the rename safe.
  #
  # `fail-fast: false` still matters at the tier level: a broken race leg
  # must not cancel the vet leg that would have named a different set of
  # modules.
  #
  # No `go build ./...` anywhere, including the root, where it used to
  # run: a main package writes an executable into the tree (this repo has
  # committed five that way), and `go vet` type-checks every package plus
  # its tests, so it strictly subsumes build as an error detector.
  test:
    needs: discover
    name: ${{ matrix.mode }} (${{ matrix.count }} modules)
    # Go compiles here, so NOT forge-runners-small-vsphere: its 2Gi cap
    # comes with a firm rule against yarn/dotnet/docker-build/Go-compile
    # work, and the documented exception for a small Go module requires
    # measuring that module rather than assuming it. Measured for this
    # repo: a cold-cache `go test -race` on a packs/temporal-* module
    # peaks at ~790 MiB across the process tree, which would fit — but
    # the legs below run EVERY module in a tier, and the number that
    # matters is the largest one, not the one that got measured.
    # default-vsphere (4Gi) is the smallest tier that clears the rule.
    # Not medium/heavy: those are the tightly-capped pools reserved for
    # docker build/push and one-pod-per-node e2e work, and promoting into
    # them buys memory this does not need at the cost of a far smaller
    # pool.
    runs-on: forge-runners-default-vsphere
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      # `lfs: true` on EVERY checkout, enforced by TestEveryCheckoutFetchesLFS.
      # Repacking the legs must not drop it: without the objects the tracked
      # binaries arrive as pointer text, and a test that reads one fails with
      # a decode error rather than anything that names LFS.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Vet and test every ${{ matrix.mode }} module
        env:
          MODE: ${{ matrix.mode }}
          MODULES: ${{ matrix.modules }}
        run: |
          set -u

          # Failures go to a FILE, and the file is read at the end. The
          # loop body cannot fail the job on its own — `exit 1` in there
          # would stop at the first broken module and throw away the rest
          # of the list, which is the whole reason the per-module matrix
          # existed. Same idiom, and same reasoning, as CLAUDE.md's verify
          # loop. Unlike that one this runs in a fresh container with no
          # other agent in it, so RUNNER_TEMP needs no mktemp collision
          # guard.
          fails="${RUNNER_TEMP:-/tmp}/ci-fails"
          : > "$fails"

          # `for m in $MODULES` is a DELIBERATE unquoted expansion — the
          # matrix carries a space-joined list and word-splitting is how
          # it is read back. `set -f` is the other half: without it the
          # same expansion also glob-expands, so a module path containing
          # a `*` would silently become whatever matched in the workdir.
          # Nothing below needs globbing, so it stays off for the rest of
          # the step.
          set -f
          for m in $MODULES; do
            echo "::group::$m ($MODE)"

            if ! ( cd "$m" && go vet ./... ); then
              # Matches the old shape: a module that fails vet is not then
              # tested, because the vet step ran first and the job stopped.
              echo "::error::$m — go vet failed"
              printf '%s\n' "$m" >> "$fails"
              echo "::endgroup::"
              continue
            fi

            case "$MODE" in
              # apps/* are VETTED BUT NOT TESTED; discovery's tier switch
              # is the authority on which modules those are.
              vet)  ;;
              test) ( cd "$m" && go test ./... ) ||
                      { echo "::error::$m — go test failed"; printf '%s\n' "$m" >> "$fails"; } ;;
              race) ( cd "$m" && go test -race ./... ) ||
                      { echo "::error::$m — go test -race failed"; printf '%s\n' "$m" >> "$fails"; } ;;
              # An unrecognised mode means discovery emitted a tier this
              # step does not implement, which would otherwise VET the
              # modules and silently skip their tests.
              *)    echo "::error::unknown mode '$MODE' — discovery and this step disagree"
                    exit 1 ;;
            esac

            echo "::endgroup::"
          done

          if [ -s "$fails" ]; then
            echo "::error::$MODE leg failed for: $(tr '\n' ' ' < "$fails")"
            {
              echo "### $MODE — failed"
              echo
              sed 's/^/- `/; s/$/`/' "$fails"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### $MODE — all modules passed" >> "$GITHUB_STEP_SUMMARY"

  # A matrix job with no legs is SKIPPED, not failed, and `needs:` treats
  # a skipped dependency as satisfied-but-not-successful in ways that are
  # easy to get wrong. This gate is the one place that turns "the matrix
  # never ran" into red, and it is why `image` needs it rather than
  # needing `test` directly.
  modules:
    needs: [discover, test]
    if: always()
    # Three `echo`s and a `case`. Nothing smaller than small exists.
    runs-on: forge-runners-small-vsphere
    steps:
      - name: All discovered modules passed
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MODULE_COUNT: ${{ needs.discover.outputs.count }}
        run: |
          echo "discover: $DISCOVER_RESULT ($MODULE_COUNT modules)"
          echo "test:     $TEST_RESULT"
          [ "$DISCOVER_RESULT" = success ] || { echo "::error::discovery did not succeed"; exit 1; }
          [ "$TEST_RESULT" = success ] || { echo "::error::the per-tier matrix did not succeed"; exit 1; }
          case "$MODULE_COUNT" in
            ''|*[!0-9]*) echo "::error::discovery reported no module count"; exit 1 ;;
          esac
          [ "$MODULE_COUNT" -ge 2 ] || { echo "::error::discovery reported only $MODULE_COUNT module(s)"; exit 1; }

  # The gRPC control plane (issue #110): proto/ is the source of truth,
  # generated Go/Python/TS is committed. Gates: buf lint, buf breaking
  # against main, regenerate-and-diff drift check, then each committed
  # client actually compiles/passes its smoke test.
  contract:
    # Compiles Go (buf via `go run`), then `npm ci` + `tsc` for two TS
    # clients and the Python client's suite — three toolchains, so the
    # same 4Gi tier the module legs use rather than small's 2Gi.
    runs-on: forge-runners-default-vsphere
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Proto lint
        run: go run github.com/bufbuild/buf/cmd/buf@v1.72.0 lint proto

      # Fetch main into a neutral local branch so the comparison works
      # both on PRs (against the target) and on pushes to main itself
      # (trivially against HEAD).
      - name: Proto breaking against main
        run: |
          git fetch origin main:refs/heads/ci-buf-breaking-base
          go run github.com/bufbuild/buf/cmd/buf@v1.72.0 breaking proto --against '.git#branch=ci-buf-breaking-base,subdir=proto'

      # Committed generated code must be exactly what the pinned plugins
      # produce, and ONLY that — the diff below is scoped to the `out:`
      # directories, not run bare over the whole tree. Same shape as
      # `discover` above and for the same reason: the watched paths are
      # DERIVED from proto/buf.gen.yaml's own `out:` fields at run time,
      # not written here as a list. A written list goes stale the moment a
      # plugin is added or an `out:` is renamed, and staleness here is
      # worse than in `discover` — there the failure mode is "skip a
      # module", here it is "watch the wrong directory and call whatever
      # differs there Generated code drift", which is actively misleading
      # rather than merely incomplete.
      #
      # That mislabeling already happened with a bare `git diff
      # --exit-code`: a PR adding `*.gif filter=lfs` to .gitattributes made
      # every already-committed demo GIF clean to an LFS pointer and read
      # as modified, and the unscoped diff failed this job over two dozen
      # media files no protoc plugin has ever touched — under this step's
      # name, sending whoever read the log looking in proto/ for a bug
      # that was actually in .gitattributes.
      #
      # The four `out:` dirs also each hold a few hand-authored companions
      # (clients/python/pyproject.toml, its py.typed marker and its test
      # suite; clients/ts/*/src/index.ts's handwritten barrels — its own
      # comment says so) that this pathspec still watches. That is
      # deliberate slack in the boundary: the alternative is tracking every
      # generated leaf file by name, which re-adds the exact staleness this
      # derivation exists to remove.
      #
      # `git diff --exit-code` with an EMPTY pathspec after `--`, or none
      # at all, still fails on a dirty tree — that direction is already
      # safe and is not guarded below. The unguarded direction is a
      # mis-parse that yields a PLAUSIBLE, EXISTING, WRONG path (a stray
      # quote or inline comment folded into the value, say): that pathspec
      # matches nothing changed, `git diff --exit-code` on an untouched
      # path exits 0, and the job goes green over real drift in whichever
      # `out:` dir got missed — silently, exactly the failure this step
      # exists to catch. The two checks below close that gap: at least one
      # path parsed, and every parsed path exists in the checkout.
      # TestGeneratedCodeDriftWatchesEveryBufOutput pins the extraction
      # itself against an independent parse of proto/buf.gen.yaml.
      - name: Generated code drift
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.72.0 generate --template proto/buf.gen.yaml

          # `out:` lines only: some leading whitespace then the literal
          # key, so a comment (`#` right after the indent) never matches,
          # and neither does any other key merely ending in "out:" — none
          # is preceded by whitespace immediately before those letters.
          mapfile -t out_dirs < <(grep -oP '^\s+out:\s*\K\S+' proto/buf.gen.yaml | sort -u)

          if [ "${#out_dirs[@]}" -eq 0 ]; then
            echo "::error::parsed zero \`out:\` directories from proto/buf.gen.yaml — the grep broke, not the tree. Fix the parser before trusting this step again."
            exit 1
          fi
          for d in "${out_dirs[@]}"; do
            if [ ! -d "$d" ]; then
              echo "::error::proto/buf.gen.yaml declares out: $d, which does not exist in the checkout. The parser picked up something that is not a real path (a quoted value, an inline comment folded in, a renamed dir) — fix the parser, not this error."
              exit 1
            fi
          done

          git diff --exit-code -- "${out_dirs[@]}"

      # grpc used to be built and tested here, alongside the proto gates.
      # It is a module like any other now, so the `test` matrix covers it
      # (under -race, unchanged) and this job stays about the wire
      # contract: lint, breaking-change, drift, and the committed non-Go
      # clients. Leaving a copy here would have made grpc the one module
      # this file still named.

      - name: Python client smoke
        run: |
          python3 -m pip install ./clients/python
          python3 -m unittest discover -s clients/python/tests -v

      - name: TypeScript clients typecheck
        run: |
          cd clients/ts/connect
          npm ci
          npx tsc -p tsconfig.json
          cd ../grpc-js
          npm ci
          npx tsc -p tsconfig.json

  image:
    # `modules`, not `test`: an empty matrix leaves `test` SKIPPED, and a
    # skipped dependency would let the image publish on a run that
    # compiled nothing.
    needs: modules
    # docker build/push is exactly what forge-runners-medium-vsphere is
    # the tier for. It is one of the two tightly-capped pools, which is
    # affordable here because this is a single job — and buildx against
    # the 4Gi default tier is the case those caps exist to keep off it.
    runs-on: forge-runners-medium-vsphere
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: docker/setup-buildx-action@v3

      # Pull requests build the image to catch Dockerfile regressions, but
      # only pushes to main and v* tags publish it.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
