name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/wonderforgelabs/gooey

jobs:
  # EVERY MODULE IN THE REPO IS DISCOVERED HERE — NOTHING BELOW NAMES ONE.
  #
  # The `test` job used to be seven steps: `go build/vet/test` for the
  # root, then one literal `if [ -f <path>/go.mod ]` step each for
  # handlers/temporal, handlers/exec, imagefmt/svg and mcp (with grpc's
  # copy over in `contract`), plus a glob loop for packs/*. Only the glob
  # was discovery, and the comment on it already predicted what happened
  # next: "a module added without also editing this file is never built,
  # and the guard makes that look like a pass."
  #
  # It came true twice. `paint/` (the fogleman/gg bridge, #229 and #241)
  # landed with no step at all and was caught by a human reading a diff.
  # `examples/wysiwyg` — a real consumer of core — was never built either,
  # alongside examples/gitui, examples/kanbandemo and
  # examples/dynamic-activities. Both times every job was green, because a
  # green CI meant "everything I was told about passed".
  #
  # The discovery below is character-for-character the loop in CLAUDE.md's
  # `## Verify` section — same `find`, same pruning — because
  # `TestCIWorkflowDiscoversEveryNestedModule` extracts this exact command
  # out of this file, runs it, and compares the result against a walk of
  # the tree. That test is what makes the module count KNOWABLE rather
  # than asserted: it goes red the moment this command stops reaching a
  # module, which no amount of green in the matrix can do on its own.
  # `TestCLAUDEMDVerifyLoopReachesEveryNestedModule` pins the doc the same
  # way, so the workflow and the doc cannot drift apart either.
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mods.outputs.matrix }}
      count: ${{ steps.mods.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - name: Discover modules
        id: mods
        run: |
          set -u

          # `-mindepth 1` lets a depth-1 dot-directory be pruned at all AND
          # keeps `-name` off the starting point; without it `.?*` matches
          # `.` itself, prunes the whole walk, prints nothing, and still
          # exits 0. Pruning at every depth (not `-not -path './.*'`, which
          # only anchors at the top) keeps this out of .claude/worktrees/
          # and stray .venv trees on a developer machine. Neither exists in
          # a clean CI checkout — that asymmetry is exactly why the rule
          # has to be written here rather than rediscovered locally.
          tmp=${RUNNER_TEMP:-/tmp}
          find . -mindepth 1 -name '.?*' -prune -o -name go.mod -print |
            sed 's|^\./||' | sort > "$tmp/modules-found"

          # A SECOND, INDEPENDENT MECHANISM, because an empty matrix is the
          # same bug in a new costume: GitHub SKIPS a job whose matrix has
          # no legs, and a skipped job is not a failed one. git knows the
          # tracked go.mod files; the walk knows the ones on disk. Any
          # disagreement is a real defect — either the prune/pathspec
          # broke, or somebody added a module and never `git add`ed its
          # go.mod, in which case CI would be testing a module that does
          # not exist for anybody else. Two mechanisms agreeing is a
          # stronger claim than "at least one was found", which 0 == 0 also
          # satisfies.
          git ls-files -- ':(glob)**/go.mod' | sort > "$tmp/modules-tracked"
          if ! diff -u "$tmp/modules-tracked" "$tmp/modules-found"; then
            echo "::error::the module walk and git ls-files disagree; see the diff above"
            exit 1
          fi

          mapfile -t mods < "$tmp/modules-found"
          # The floor the cross-check cannot provide on its own. The root
          # go.mod is the one module whose absence means the checkout
          # itself is broken, so requiring it plus one more is a bound that
          # no plausible breakage satisfies by accident. Membership, not
          # position: the list is sorted, and `examples/…` sorts before
          # `go.mod`, so testing mods[0] rejected a perfectly good tree
          # (found by running this script against the worktree).
          if [ "${#mods[@]}" -lt 2 ] || ! grep -qxF 'go.mod' "$tmp/modules-found"; then
            printf '%s\n' "${mods[@]}"
            echo "::error::discovery found ${#mods[@]} module(s) and no root go.mod — the checkout or the walk is broken"
            exit 1
          fi

          # The ONLY hand-written classification left in this file, and it
          # matches PATH PATTERNS, not module names: a new pack, handler or
          # example is covered the moment its go.mod is committed.
          #
          # THE RULE, stated so the arms can be checked against it: a
          # module races when its tests exist to prove that nothing
          # touches the property graph off the UI goroutine — that is,
          # when it serves somebody else's goroutine. handlers/*, packs/*,
          # mcp and grpc all do (RPCs, tool bodies, activity goroutines,
          # child-process callbacks); #182 sat on main because one of them
          # was not raced. paint starts no goroutines at all, so the
          # detector would buy CI time and no assertion — the reasoning
          # #258 wrote for its own step, kept here now that discovery
          # subsumes it.
          #
          # That rule is NOT derivable, and pretending otherwise would be
          # worse than a case statement: "serves a foreign goroutine" is a
          # claim about what a suite asserts, not a property of the tree,
          # and every mechanical proxy (does it spawn goroutines? does it
          # import net/http?) misclassifies the root module, which spawns
          # plenty and is deliberately not raced. What IS derivable is the
          # drift: TestCIWorkflowRaceTierMatchesCLAUDEMD compares this arm
          # against CLAUDE.md's, and rejects a namespaced entry written
          # literally (`handlers/temporal` instead of `handlers/*`),
          # because a literal is where the next module silently drops a
          # tier.
          #
          # The safe evolution, if this ever drifts again, is to invert it:
          # race by DEFAULT and make exemption the explicit act, so a new
          # module fails toward the stronger check. Not done here — it
          # would race the root module, which is a tier change, and tier
          # changes belong in their own PR rather than smuggled into a
          # mechanism one.
          #
          # examples/* are VETTED BUT NOT TESTED. Vetting is the point: it
          # is what catches a core API change breaking a consumer, the
          # breakage CLAUDE.md says goes silent today. Their tests are
          # deliberately left out — examples/wysiwyg alone carries
          # goroutine-leak, pty-harness and control-plane-server suites,
          # and putting that flake surface on a required gate buys little,
          # since an example is not part of the framework's contract.
          # Promoting one is a one-line change to the case below.
          #
          # Everything the two arms above do not name gets the plain run —
          # written as the default arm rather than a third list, so nobody
          # has to keep a roster of library modules current. That the root
          # module's own tests do not race is a known gap, inherited
          # unchanged rather than smuggled into this change.
          for mod in "${mods[@]}"; do
            m=${mod%go.mod}; m=${m%/}; m=${m:-.}
            case "$m" in
              examples/*)                  mode='vet'  ;;
              handlers/*|packs/*|mcp|grpc) mode='race' ;;
              *)                           mode='test' ;;
            esac
            printf '%s\t%s\n' "$m" "$mode"
          done > "$tmp/modules-tiered"

          matrix=$(jq -Rnc '[inputs | split("\t") | {module: .[0], mode: .[1]}]' < "$tmp/modules-tiered")
          legs=$(jq length <<<"$matrix")
          # The JSON must describe every discovered module or this job is
          # lying about its own coverage — the failure mode being fixed,
          # one level up.
          if [ "$legs" != "${#mods[@]}" ]; then
            echo "::error::built $legs matrix leg(s) from ${#mods[@]} discovered module(s)"
            exit 1
          fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$legs" >> "$GITHUB_OUTPUT"
          {
            echo "### $legs modules discovered"
            echo
            jq -r '.[] | "- `\(.module)` — \(.mode)"' <<<"$matrix"
          } >> "$GITHUB_STEP_SUMMARY"

  # One leg per discovered module, so a failure names its own module
  # instead of arriving as "the test job is red". `fail-fast: false`
  # because the useful output of a broken core API change is the full list
  # of modules it broke, not the first one alphabetically.
  #
  # No `go build ./...` anywhere, including the root, where it used to
  # run: a main package writes an executable into the tree (this repo has
  # committed five that way), and `go vet` type-checks every package plus
  # its tests, so it strictly subsumes build as an error detector.
  test:
    needs: discover
    name: ${{ matrix.module }} (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: '**/go.sum'

      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: Test
        if: matrix.mode == 'test'
        working-directory: ${{ matrix.module }}
        run: go test ./...

      - name: Test (race)
        if: matrix.mode == 'race'
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  # A matrix job with no legs is SKIPPED, not failed, and `needs:` treats
  # a skipped dependency as satisfied-but-not-successful in ways that are
  # easy to get wrong. This gate is the one place that turns "the matrix
  # never ran" into red, and it is why `image` needs it rather than
  # needing `test` directly.
  modules:
    needs: [discover, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All discovered modules passed
        env:
          DISCOVER_RESULT: ${{ needs.discover.result }}
          TEST_RESULT: ${{ needs.test.result }}
          MODULE_COUNT: ${{ needs.discover.outputs.count }}
        run: |
          echo "discover: $DISCOVER_RESULT ($MODULE_COUNT modules)"
          echo "test:     $TEST_RESULT"
          [ "$DISCOVER_RESULT" = success ] || { echo "::error::discovery did not succeed"; exit 1; }
          [ "$TEST_RESULT" = success ] || { echo "::error::the per-module matrix did not succeed"; exit 1; }
          case "$MODULE_COUNT" in
            ''|*[!0-9]*) echo "::error::discovery reported no module count"; exit 1 ;;
          esac
          [ "$MODULE_COUNT" -ge 2 ] || { echo "::error::discovery reported only $MODULE_COUNT module(s)"; exit 1; }

  # The gRPC control plane (issue #110): proto/ is the source of truth,
  # generated Go/Python/TS is committed. Gates: buf lint, buf breaking
  # against main, regenerate-and-diff drift check, then each committed
  # client actually compiles/passes its smoke test.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Proto lint
        run: go run github.com/bufbuild/buf/cmd/buf@v1.72.0 lint proto

      # Fetch main into a neutral local branch so the comparison works
      # both on PRs (against the target) and on pushes to main itself
      # (trivially against HEAD).
      - name: Proto breaking against main
        run: |
          git fetch origin main:refs/heads/ci-buf-breaking-base
          go run github.com/bufbuild/buf/cmd/buf@v1.72.0 breaking proto --against '.git#branch=ci-buf-breaking-base,subdir=proto'

      # Committed generated code must be exactly what the pinned
      # plugins produce. Remote plugins: needs network, nothing else.
      - name: Generated code drift
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.72.0 generate --template proto/buf.gen.yaml
          git diff --exit-code

      # grpc used to be built and tested here, alongside the proto gates.
      # It is a module like any other now, so the `test` matrix covers it
      # (under -race, unchanged) and this job stays about the wire
      # contract: lint, breaking-change, drift, and the committed non-Go
      # clients. Leaving a copy here would have made grpc the one module
      # this file still named.

      - name: Python client smoke
        run: |
          python3 -m pip install ./clients/python
          python3 -m unittest discover -s clients/python/tests -v

      - name: TypeScript clients typecheck
        run: |
          cd clients/ts/connect
          npm ci
          npx tsc -p tsconfig.json
          cd ../grpc-js
          npm ci
          npx tsc -p tsconfig.json

  image:
    # `modules`, not `test`: an empty matrix leaves `test` SKIPPED, and a
    # skipped dependency would let the image publish on a run that
    # compiled nothing.
    needs: modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build the image to catch Dockerfile regressions, but
      # only pushes to main and v* tags publish it.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
