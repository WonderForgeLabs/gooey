name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/wonderforgelabs/gooey

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # handlers/temporal is a separate module, excluded from the root
      # ./... patterns. The guard keeps CI green both before and after it
      # lands on main.
      #
      # -race for the reason handlers/exec and mcp have it: the provider
      # runs every activity on its own goroutine, so a page that fires
      # several at once is exactly the shape the detector exists for.
      # Without it the module's concurrency is untested, which is how
      # #182 sat on main unnoticed.
      - name: Build and test handlers/temporal
        run: |
          if [ -f handlers/temporal/go.mod ]; then
            cd handlers/temporal
            go build ./...
            go test -race ./...
          else
            echo "handlers/temporal/go.mod not present; skipping"
          fi

      # handlers/exec is a separate module too — its jq extraction takes
      # gojq (pure Go, but a real dependency), and the deps⇒nested rule
      # of the pack-distribution doctrine keeps it out of the root
      # graph. -race because its tests drive real child processes and
      # the timeout/kill path crosses goroutines.
      - name: Build and test handlers/exec
        run: |
          if [ -f handlers/exec/go.mod ]; then
            cd handlers/exec
            go build ./...
            go vet ./...
            go test -race ./...
          else
            echo "handlers/exec/go.mod not present; skipping"
          fi

      # packs/temporal-visibility is an ACTIVITY PACK — its own module
      # with zero gooey imports (graph: Temporal SDK + API protos only),
      # so any Go Temporal worker can import it. handlers/temporal
      # consumes it via a replace directive.
      - name: Build and test packs/temporal-visibility
        run: |
          if [ -f packs/temporal-visibility/go.mod ]; then
            cd packs/temporal-visibility
            go build ./...
            go vet ./...
            go test ./...
          else
            echo "packs/temporal-visibility/go.mod not present; skipping"
          fi

      # imagefmt/svg is a separate module for the same reason — the SVG
      # rasterizer (oksvg + rasterx) stays out of core's graph, and apps
      # opt in with a blank import.
      - name: Build and test imagefmt/svg
        run: |
          if [ -f imagefmt/svg/go.mod ]; then
            cd imagefmt/svg
            go build ./...
            go vet ./...
            go test ./...
          else
            echo "imagefmt/svg/go.mod not present; skipping"
          fi

      # mcp is a separate module for the same reason (the MCP SDK's graph),
      # so the root ./... patterns skip it too. It runs under -race
      # deliberately: what its tests prove is that no tool body ever touches
      # the property graph from an http goroutine, and without the detector
      # that assertion is only half made.
      - name: Build and test mcp
        run: |
          if [ -f mcp/go.mod ]; then
            cd mcp
            go build ./...
            go vet ./...
            go test -race ./...
          else
            echo "mcp/go.mod not present; skipping"
          fi

  # The gRPC control plane (issue #110): proto/ is the source of truth,
  # generated Go/Python/TS is committed. Gates: buf lint, buf breaking
  # against main, regenerate-and-diff drift check, then each committed
  # client actually compiles/passes its smoke test.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Proto lint
        run: go run github.com/bufbuild/buf/cmd/buf@v1.72.0 lint proto

      # Fetch main into a neutral local branch so the comparison works
      # both on PRs (against the target) and on pushes to main itself
      # (trivially against HEAD).
      - name: Proto breaking against main
        run: |
          git fetch origin main:refs/heads/ci-buf-breaking-base
          go run github.com/bufbuild/buf/cmd/buf@v1.72.0 breaking proto --against '.git#branch=ci-buf-breaking-base,subdir=proto'

      # Committed generated code must be exactly what the pinned
      # plugins produce. Remote plugins: needs network, nothing else.
      - name: Generated code drift
        run: |
          go run github.com/bufbuild/buf/cmd/buf@v1.72.0 generate --template proto/buf.gen.yaml
          git diff --exit-code

      # grpc is the wire module (generated Go plus the issue #111
      # server) — a separate module like mcp/, so grpc-go and protobuf
      # stay out of the root graph. -race for the same reason mcp runs
      # under it: the tests prove no RPC touches the property graph off
      # the UI goroutine, and that claim is half-made without the
      # detector.
      - name: Build and test grpc
        run: |
          if [ -f grpc/go.mod ]; then
            cd grpc
            go build ./...
            go vet ./...
            go test -race ./...
          else
            echo "grpc/go.mod not present; skipping"
          fi

      - name: Python client smoke
        run: |
          python3 -m pip install ./clients/python
          python3 -m unittest discover -s clients/python/tests -v

      - name: TypeScript clients typecheck
        run: |
          cd clients/ts/connect
          npm ci
          npx tsc -p tsconfig.json
          cd ../grpc-js
          npm ci
          npx tsc -p tsconfig.json

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Pull requests build the image to catch Dockerfile regressions, but
      # only pushes to main and v* tags publish it.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
