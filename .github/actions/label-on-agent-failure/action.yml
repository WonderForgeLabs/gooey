name: 'Label on Claude agent failure'
description: >
  Reads a claude-code-action execution_file, fails the calling step when the
  agent terminated abnormally, and — if a resource number is given — stamps
  that issue/PR with a single failed:<workflow-name> label so affected
  resources are discoverable with `gh issue list --label
  failed:<workflow-name>` instead of cross-referencing Actions run history by
  hand (see WonderForgeLabs/forge#3053, where that manual cross-reference is
  how a silently-failing workflow was found).
  Permission denials are reported as a warning only and never label the
  resource: a denial the agent recovered from says something is missing from
  the caller's --allowedTools, not that this issue/PR failed to process
  (WonderForgeLabs/forge#3219).

  Copied from WonderForgeLabs/forge's .github/actions/label-on-agent-failure —
  a composite action can't be consumed cross-repo the way a reusable workflow
  can, so each repo carries its own copy. Keep it in sync by hand.

inputs:
  execution-file:
    description: 'Path to the claude-code-action execution_file output. Empty/missing is treated as "nothing to check".'
    required: false
    default: ''
  repo:
    description: 'owner/repo'
    required: true
  resource-number:
    description: 'Issue or PR number to label on failure. Leave empty to skip labeling (e.g. a scheduled sweep with no single target) while still failing the job on is_error.'
    required: false
    default: ''
  label:
    description: 'Label to apply on failure, e.g. failed:issue-intake'
    required: true
  github-token:
    description: 'Token with issues:write (repo-level label create/apply) permission'
    required: true
  agent-step-outcome:
    description: >
      Optional: pass the calling workflow's agent step's outcome value (its
      "steps context" outcome field, looked up by that step's id). A
      job-timeout kill leaves the agent step with no execution_file at all
      (the action never gets to write it), which the execution-file check
      alone reads as "can't verify, assume fine" — a cancelled/timed-out run
      then silently reports success. Any value here other than 'success'
      (e.g. 'cancelled', 'failure') is treated as a confirmed failure
      regardless of what the execution file shows. Leave empty to skip this
      check (falls back to execution-file-only detection).
    required: false
    default: ''

outputs:
  is_error:
    description: 'true if the agent terminated abnormally'
    value: ${{ steps.check.outputs.is_error }}
  denials:
    description: 'permission denial count'
    value: ${{ steps.check.outputs.denials }}
  failed:
    description: >
      true if a real failure was detected (is_error, i.e. the agent aborted or
      the agent step did not succeed). Permission denials alone do NOT set
      this — see `denials`.
    value: ${{ steps.check.outputs.failed }}

runs:
  using: composite
  steps:
    # The body lives in check.sh rather than inline here so it can be
    # unit-tested (check.test.sh, run by ci.yml's discover job) — the labelling
    # rule is subtle enough that a regression is invisible on a green run
    # (denials-only used to label the resource while reporting success).
    #
    # Invoked via `bash <path>` rather than executed directly: that holds even
    # if a checkout drops the exec bit.
    - id: check
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repo }}
        RESOURCE_NUMBER: ${{ inputs.resource-number }}
        LABEL: ${{ inputs.label }}
        EXECUTION_FILE: ${{ inputs.execution-file }}
        AGENT_STEP_OUTCOME: ${{ inputs.agent-step-outcome }}
      run: bash "${GITHUB_ACTION_PATH}/check.sh"
