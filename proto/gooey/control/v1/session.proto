// SessionService — the streaming control plane.
//
// One bidi stream, mirroring the framework's own shape: the client
// side is ONE ordered stream of acts, exactly as the terminal is one
// ordered input.Event stream; the server side is one ordered stream of
// events, framed on the app's composed frames.
//
// The consistency rule (issue #49's torn-read lesson): everything that
// changed within one composed frame — property deltas, damage, the
// structure swap that caused them — arrives in ONE FrameDelta message.
// A client can never observe values without the frame they belong to,
// by construction; there is no delta channel to tear away from its
// markup.

syntax = "proto3";

package gooey.control.v1;

import "gooey/control/v1/control.proto";
import "gooey/control/v1/types.proto";

option go_package = "github.com/WonderForgeLabs/gooey/grpc/gen/gooey/control/v1;controlv1";

// SessionService attaches a client to a running app for the lifetime
// of the stream. Push replaces polling (issue #49): a subscribed
// client hears about a change when the frame containing it composes,
// not on the next 400ms tick.
service SessionService {
  // Attach opens a session. The first client message must be
  // `subscribe`; every later one is an `act`. Server messages start
  // with `welcome` and then interleave act results with subscribed
  // events. Closing either direction ends the session; the app
  // outlives every session.
  rpc Attach(stream AttachRequest) returns (stream AttachResponse);
}

message AttachRequest {
  oneof msg {
    // First message only; a second subscribe is INVALID_ARGUMENT.
    Subscription subscribe = 1;
    Act act = 2;
  }
}

// Subscription selects the event channels this session receives.
// Everything is opt-in; an all-defaults Subscription receives only
// welcome and act results — a write-only session.
message Subscription {
  // Property deltas, delivered inside FrameDelta.
  bool properties = 1;
  // Restrict property deltas to these dotted names; empty means all.
  repeated string names = 2;
  // Frame events (damage rects, repaint counts) even when no
  // subscribed property changed.
  bool frames = 3;
  // Echo of the app's input stream (terminal AND remote), as consumed.
  bool input = 4;
  // Lifecycle: resize, markup swap, shutdown.
  bool lifecycle = 5;
}

// Act is one client action. Acts are applied in stream order on the
// UI goroutine — the remote mirror of the one ordered input stream —
// and each is answered by exactly one ActResult carrying the same id.
message Act {
  // Client-assigned correlation id, echoed in the ActResult.
  uint64 id = 1;
  // The same request messages the unary surface takes: one model, two
  // transports.
  oneof act {
    SetPropertyRequest set_property = 2;
    InvokeCommandRequest invoke_command = 3;
    SendKeysRequest send_keys = 4;
    SendPointerRequest send_pointer = 5;
    SetFocusRequest set_focus = 6;
    SwapMarkupRequest swap_markup = 7;
    RegisterPropertiesRequest register_properties = 8;
  }
}

message AttachResponse {
  oneof msg {
    Welcome welcome = 1;
    ActResult result = 2;
    FrameDelta frame = 3;
    LifecycleEvent lifecycle = 4;
    InputEcho input = 5;
  }
}

// Welcome answers the subscribe: who the app is and where its screen
// stands. Initial state is read through the unary surface (or the
// first FrameDelta); Welcome deliberately carries identity, not data.
message Welcome {
  string app_name = 1;
  string app_version = 2;
  int32 columns = 3;
  int32 rows = 4;
  // The frame sequence number as of attach; the session's first
  // FrameDelta will carry a number greater than this.
  uint64 frame = 5;
}

// ActResult answers one Act. Errors use the same status codes as the
// unary surface, carried in-stream so one failed act does not tear
// down the session.
message ActResult {
  uint64 id = 1;
  // A google.rpc.Code value; 0 (OK) on success.
  uint32 code = 2;
  // Human-readable error, empty on success.
  string message = 3;
  // The same response messages the unary surface returns.
  oneof result {
    SetPropertyResponse set_property = 4;
    InvokeCommandResponse invoke_command = 5;
    SendKeysResponse send_keys = 6;
    SendPointerResponse send_pointer = 7;
    SetFocusResponse set_focus = 8;
    SwapMarkupResponse swap_markup = 9;
    RegisterPropertiesResponse register_properties = 10;
  }
}

// FrameDelta is everything one composed frame changed, in one message.
// Atomic by construction: values and the frame they belong to cannot
// arrive separately, which is the streaming form of the served-UI
// rule that markup and values travel as a consistent pair.
message FrameDelta {
  // Monotonically increasing frame sequence number.
  uint64 frame = 1;
  // Subscribed properties that changed in this frame, with their
  // settled values.
  repeated PropertyChange changes = 2;
  // Damage rectangles repainted this frame, in cells.
  repeated Rect damage = 3;
  // How many components repainted — the damage-discipline number the
  // framework's contract tests assert on (focus moves repaint 2).
  int32 repainted = 4;
}

message LifecycleEvent {
  oneof event {
    Resized resized = 1;
    Swapped swapped = 2;
    Closing closing = 3;
  }
}

// Resized reports the terminal's new size.
message Resized {
  int32 columns = 1;
  int32 rows = 2;
}

// Swapped reports that the page was replaced — by hot reload, by any
// client's SwapMarkup, or by the app itself. The named table is the
// new tree's.
message Swapped {
  repeated string named = 1;
}

// Closing reports that the app is shutting down; the stream ends
// after this message.
message Closing {}

// InputEcho is one event from the app's single ordered input stream,
// echoed to subscribers after dispatch.
message InputEcho {
  InputEvent event = 1;
  bool consumed = 2;
}
