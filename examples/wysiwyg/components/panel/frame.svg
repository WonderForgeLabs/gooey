<svg xmlns="http://www.w3.org/2000/svg" width="{{W}}" height="{{H}}" viewBox="0 0 {{W}} {{H}}">
  <!-- The panel frame, as line art.

       Authored in USER UNITS that equal output pixels: the width and
       height are substituted per instance and the viewBox matches them
       1:1, so a stroke declared 1.5 wide is 1.5 pixels wide at every
       panel size. A fixed viewBox scaled to fit would make the stroke
       thickness a function of the pane's size — thin in a wide pane, fat
       in a narrow one — which is the tell of a scaled bitmap and the
       thing this whole approach exists to avoid.

       The interior is left EMPTY, not filled. Sixel carries no alpha, so
       an unpainted pixel is one the encoder never writes and the cell
       beneath it survives — which is what lets the pane's text live on
       the cell plane inside this frame. A background fill here would be
       a solid block over the content.

       currentColor is substituted before rasterizing (the rasterizer has
       no CSS cascade), which is also how the focused and unfocused
       variants differ. -->

  <!-- The frame proper: a rounded rectangle, inset by half the stroke so
       the stroke's outer edge lands ON the boundary rather than half
       outside it and clipped. -->
  <rect x="0.75" y="0.75" width="{{W_1_5}}" height="{{H_1_5}}"
        rx="6" ry="6"
        fill="none" stroke="currentColor" stroke-width="1.5"/>

  <!-- A hairline inside the top edge — the one flourish, and it is the
       detail that reads as "modern" rather than "boxed". It is what a
       title bar's underline is in VS Code, drawn at 40% so it reads as a
       division rather than a second border. -->
  <line x1="7" y1="{{TITLE_Y}}" x2="{{W_7}}" y2="{{TITLE_Y}}"
        stroke="currentColor" stroke-width="1" stroke-opacity="0.4"/>
</svg>
