# Single-select `options` and their ids are read by the issue-intake workflow
# via `yq` (e.g. `.fields.Status.options[] | select(.name == "Todo") | .id`),
# so a field with no `options` block here cannot be set by intake at all.
#
# These ids are PER-BOARD — they are not portable from forge or any other
# repo's project-ops.yaml. Every id below was read off gooey's live board
# (project PVT_kwDODZK67M4Bf59T) via the ProjectV2 GraphQL `fields` query, not
# copied. Re-read them the same way if the board's options are ever edited.
