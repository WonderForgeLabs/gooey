  Priority:
    id: PVTSSF_lADODZK67M4Bf59TzhaJbT8
    options:
      - name: "P0 - Critical Path"
        id: 20e57b21
      - name: "P1 - High"
        id: 7a5f18f7
      - name: "P2 - Medium"
        id: ca38a3ab
      - name: "P3 - Low"
        id: 46c5a49d
      - name: "P4 - Future"
        id: 3c28b9d8
  # Only one option exists on gooey's board today ("None"). Intake reads this
  # list dynamically rather than hardcoding a choice, so adding real options to
  # the board + this file is all that's needed to start classifying — no
  # workflow edit.
  Critical Path:
    id: PVTSSF_lADODZK67M4Bf59TzhaJblI
    options:
      - name: "None"
